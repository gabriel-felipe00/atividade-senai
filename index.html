
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha sua Plataforma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        /* Tela Inicial: Cartão do QR Code */
        .qr-card {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            width: 320px;
            height: 320px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            cursor: pointer; 
            transition: transform 0.2s;
        }

        .qr-card:hover {
            transform: scale(1.03);
        }

        .qr-code {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: white;
            padding: 10px;
            border-radius: 10px;
        }

        /* Tela de Escolha */
        .choice-screen {
            display: none;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 320px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .choice-screen h2 {
            color: #1e293b;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* Botões */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: center;
        }

        .btn-youtube {
            background-color: #ff0000;
        }

        .btn-youtube:hover {
            background-color: #cc0000;
        }

        /* Novo Botão do Google Forms */
        .btn-forms {
            background-color: #46bc64;
        }

        .btn-forms:hover {
            background-color: #35984f;
        }

        /* Botão de Voltar */
        .btn-back {
            background-color: #e2e8f0;
            color: #475569;
            margin-top: 10px;
            margin-bottom: 0;
        }

        .btn-back:hover {
            background-color: #cbd5e1;
            color: #1e293b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="qr-card" id="qrCard" onclick="mostrarOpcoes()">
            <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.youtube.com/watch?v=Bkw7q3QJpyc" alt="QR Code">
        </div>

        <div class="choice-screen" id="choiceScreen">
            <h2>Escolha uma opção:</h2>
            <a href="https://www.youtube.com/watch?v=Bkw7q3QJpyc" target="_blank" class="btn btn-youtube">Ir para o YouTube</a>
            
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSf5hJBJ96KciMuKjERnyow_QrGbkHNWp67YsFnYjyHUX2XfSw/viewform?usp=header" target="_blank" class="btn btn-forms">Ir para o Formulário</a>
            
            <button class="btn btn-back" onclick="voltarParaQr()">Voltar</button>
        </div>
    </div>

    <script>
        function mostrarOpcoes() {
            document.getElementById('qrCard').style.display = 'none';
            document.getElementById('choiceScreen').style.display = 'block';
        }

        function voltarParaQr() {
            document.getElementById('choiceScreen').style.display = 'none';
            document.getElementById('qrCard').style.display = 'flex';
        }
    </script>

</body>
</html>
